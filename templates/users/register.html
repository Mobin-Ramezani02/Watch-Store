{% extends 'base.html' %}
{% block title %}ثبت‌نام | تیک‌آرت{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mt-10 mb-20">
    <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">ایجاد حساب کاربری</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block font-bold text-gray-700">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-500 text-sm mb-4">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-lg hover:bg-yellow-500 hover:text-slate-900 transition mt-4">ثبت‌نام</button>
    </form>
    <p class="text-center mt-6 text-gray-600">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'users:login' %}" class="text-yellow-600 font-bold">وارد شوید</a></p>
</div>
{% endblock %}
