{% extends 'base.html' %}
{% block title %}ورود | تیک‌آرت{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mt-10 mb-20">
    <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">ورود به حساب کاربری</h1>
    
    {% if form.errors %}
        <p class="bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm text-center">نام کاربری یا رمز عبور اشتباه است.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block font-bold text-gray-700 mb-2">نام کاربری:</label>
            <input type="text" name="username" class="w-full border rounded-lg p-3 focus:outline-none focus:border-yellow-500" required>
        </div>
        <div class="mb-6">
            <label class="block font-bold text-gray-700 mb-2">رمز عبور:</label>
            <input type="password" name="password" class="w-full border rounded-lg p-3 focus:outline-none focus:border-yellow-500" required>
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-lg hover:bg-yellow-500 hover:text-slate-900 transition">ورود</button>
    </form>
    <p class="text-center mt-6 text-gray-600">حساب کاربری ندارید؟ <a href="{% url 'users:register' %}" class="text-yellow-600 font-bold">ثبت‌نام کنید</a></p>
</div>
{% endblock %}
